<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoQuest: Guardião da Natureza</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f1e17;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      font-size: 2.2rem;
      color: #81c784;
      margin-bottom: 5px;
      text-shadow: 0 0 10px rgba(129, 199, 132, 0.3);
    }
    p.instructions {
      color: #a5d6a7;
      margin-bottom: 20px;
      font-size: 0.95rem;
      text-align: center;
    }
    #game-card {
      background: #1b2e23;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #2e4a37;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(5, 65px);
      gap: 8px;
      margin-bottom: 20px;
    }
    .cell {
      width: 65px;
      height: 65px;
      background: #274030;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      user-select: none;
      transition: all 0.2s ease;
    }
    .player { background: #2e7d32; border: 2px solid #81c784; }
    .wall { background: #1c2820; border: 2px solid #141d17; opacity: 0.6; }
    .door { background: #f57c00; border: 2px solid #ffb74d; cursor: pointer; }
    .exit { background: #0288d1; border: 2px solid #4fc3f7; }
    .empty { background: #274030; }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 50px);
      gap: 5px;
      margin-top: 10px;
    }
    .btn-ctrl {
      width: 50px;
      height: 50px;
      background: #274030;
      border: 1px solid #3d634b;
      border-radius: 8px;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }
    .btn-ctrl:active { background: #81c784; color: #0f1e17; }

    #modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .modal-content {
      background: #1b2e23;
      padding: 25px;
      border-radius: 12px;
      border: 2px solid #81c784;
      width: 340px;
      text-align: center;
      box-shadow: 0 0 20px rgba(129,199,132,0.2);
    }
    .category-badge {
      display: inline-block;
      padding: 4px 12px;
      background: #2e7d32;
      color: #a5d6a7;
      font-size: 0.8rem;
      border-radius: 12px;
      margin-bottom: 10px;
      text-transform: uppercase;
      font-weight: bold;
    }
    #question {
      font-size: 1.1rem;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      padding: 12px;
      background: #274030;
      border: 1px solid #3d634b;
      border-radius: 8px;
      color: white;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: left;
      transition: background 0.2s;
    }
    .option-btn:hover { background: #3d634b; }
  </style>
</head>
<body>

      <button class="btn-ctrl" onclick="move(0, 1)">⬇️</button>
      <button class="btn-ctrl" onclick="move(1, 0)">➡️</button>

  </div>

  <div id="modal">
